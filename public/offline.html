<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d0c" />
    <title>Offline · SmartDrop</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b0d0c;
        color: #e8ece9;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 420px; }
      h1 { font-size: 1.5rem; margin: 0 0 12px; }
      p { color: #9aa39d; line-height: 1.5; margin: 0 0 24px; }
      a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 12px;
        background: #3ddc97;
        color: #0b0d0c;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        SmartDrop can't reach the network right now. Pages you've visited
        before are still available. Live balances, positions and transactions
        need a connection, and nothing is lost while you're offline.
      </p>
      <!-- No inline script (CSP script-src 'self'): a plain link retries. -->
      <a href="./">Try again</a>
    </main>
  </body>
</html>
